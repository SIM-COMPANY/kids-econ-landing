<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="황소를 흉내 낸 개구리">
  <rect width="200" height="200" rx="28" fill="#FFF1E8"/>
