  <!-- 다리 -->
  <ellipse cx="58" cy="150" rx="14" ry="9" fill="#6B9A30"/>
  <ellipse cx="142" cy="150" rx="14" ry="9" fill="#6B9A30"/>
  <!-- 눈 (위로 볼록) -->
  <circle cx="74" cy="64" r="18" fill="#7FB23E"/>
  <circle cx="126" cy="64" r="18" fill="#7FB23E"/>
  <circle cx="74" cy="60" r="11" fill="#FFFFFF"/>
  <circle cx="126" cy="60" r="11" fill="#FFFFFF"/>
  <circle cx="76" cy="61" r="5.5" fill="#1f2a12"/>
  <circle cx="124" cy="61" r="5.5" fill="#1f2a12"/>
  <circle cx="78" cy="59" r="1.8" fill="#fff"/>
  <circle cx="126" cy="59" r="1.8" fill="#fff"/>
  <!-- 입 (힘주는 표정) -->
  <path d="M84 104c8 6 24 6 32 0" stroke="#3c5018" stroke-width="3.5" fill="none" stroke-linecap="round"/>
